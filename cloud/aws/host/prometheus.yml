global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: processes
    static_configs:
      - targets: ["process-exporter:9256"]

  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]

