services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tinyevents-lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=15GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    cpus: 0.75
    mem_limit: 2g
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: tinyevents-lab-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin_password"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 127.0.0.1:3000:3000
    cpus: 0.50
    mem_limit: 1g
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    container_name: tinyevents-lab-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.processes
    pid: host
    volumes:
      - /:/host:ro,rslave
    cpus: 0.20
    mem_limit: 128m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: tinyevents-lab-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    cpus: 0.30
    mem_limit: 256m
    restart: unless-stopped

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: tinyevents-lab-process-exporter
    command:
      - --procfs=/host/proc
      - --config.path=/config/process-exporter.yml
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/process-exporter.yml:ro
    cpus: 0.20
    mem_limit: 128m
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: tinyevents-lab-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:54323/TinyEventsDogfoodOperations?sslmode=disable"
    extra_hosts:
      - host.docker.internal:host-gateway
    cpus: 0.20
    mem_limit: 128m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: /etc/tinyevents-lab/secrets/grafana-admin-password

